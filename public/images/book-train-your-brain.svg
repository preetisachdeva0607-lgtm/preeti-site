<svg xmlns="http://www.w3.org/2000/svg" width="400" height="560" viewBox="0 0 400 560">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d2137"/>
      <stop offset="50%" style="stop-color:#1a3a4a"/>
      <stop offset="100%" style="stop-color:#0d2137"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00b4d8"/>
      <stop offset="100%" style="stop-color:#48cae4"/>
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00b4d8;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#48cae4;stop-opacity:0.1"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="560" fill="url(#bg2)"/>

  <!-- Background circles decoration -->
  <circle cx="340" cy="100" r="140" fill="none" stroke="#00b4d8" stroke-width="0.5" opacity="0.15"/>
  <circle cx="340" cy="100" r="90" fill="none" stroke="#00b4d8" stroke-width="0.5" opacity="0.15"/>
  <circle cx="60" cy="440" r="120" fill="none" stroke="#48cae4" stroke-width="0.5" opacity="0.15"/>

  <!-- Abstract brain/neuron visualization -->
  <g transform="translate(200, 130)" opacity="0.2">
    <circle cx="0" cy="0" r="60" fill="url(#teal)"/>
    <circle cx="0" cy="0" r="35" fill="url(#teal)"/>
  </g>

  <!-- Neural connections -->
  <g opacity="0.5" filter="url(#glow2)">
    <circle cx="80" cy="80" r="4" fill="#00b4d8"/>
    <circle cx="160" cy="55" r="3" fill="#48cae4"/>
    <circle cx="240" cy="75" r="4" fill="#00b4d8"/>
    <circle cx="310" cy="50" r="3" fill="#48cae4"/>
    <circle cx="355" cy="90" r="4" fill="#00b4d8"/>
    <circle cx="130" cy="100" r="2" fill="#48cae4"/>
    <circle cx="200" cy="85" r="3" fill="#00b4d8"/>
    <circle cx="270" cy="105" r="2" fill="#48cae4"/>

    <line x1="80" y1="80" x2="160" y2="55" stroke="#00b4d8" stroke-width="0.8"/>
    <line x1="160" y1="55" x2="240" y2="75" stroke="#48cae4" stroke-width="0.8"/>
    <line x1="240" y1="75" x2="310" y2="50" stroke="#00b4d8" stroke-width="0.8"/>
    <line x1="310" y1="50" x2="355" y2="90" stroke="#48cae4" stroke-width="0.8"/>
    <line x1="80" y1="80" x2="200" y2="85" stroke="#00b4d8" stroke-width="0.5" opacity="0.5"/>
    <line x1="130" y1="100" x2="270" y2="105" stroke="#48cae4" stroke-width="0.5" opacity="0.5"/>
    <line x1="160" y1="55" x2="200" y2="85" stroke="#00b4d8" stroke-width="0.5"/>
    <line x1="200" y1="85" x2="310" y2="50" stroke="#48cae4" stroke-width="0.5"/>
  </g>

  <!-- Teal left bar -->
  <rect x="0" y="0" width="8" height="560" fill="url(#accent2)"/>

  <!-- Content -->
  <!-- Category tag -->
  <rect x="30" y="170" width="220" height="2" fill="url(#accent2)" rx="1"/>
  <text x="30" y="165" font-family="Georgia, serif" font-size="11" fill="#00b4d8" letter-spacing="3" font-weight="bold">MEMORY ENHANCEMENT</text>

  <!-- Main title -->
  <text x="30" y="230" font-family="Georgia, serif" font-size="44" fill="white" font-weight="bold" letter-spacing="-1">Train</text>
  <text x="30" y="278" font-family="Georgia, serif" font-size="44" fill="white" font-weight="bold" letter-spacing="-1">Your</text>
  <text x="30" y="326" font-family="Georgia, serif" font-size="44" fill="#00b4d8" font-weight="bold" letter-spacing="-1">Brain</text>

  <!-- Divider -->
  <rect x="30" y="345" width="340" height="1" fill="white" opacity="0.1"/>

  <!-- Tagline -->
  <text x="30" y="372" font-family="Arial, sans-serif" font-size="12" fill="#90d4e8" letter-spacing="0.5">Boost retention. Sharpen focus.</text>
  <text x="30" y="390" font-family="Arial, sans-serif" font-size="12" fill="#90d4e8" letter-spacing="0.5">Recall faster. Think smarter.</text>

  <!-- Lightning bolt icon -->
  <g transform="translate(290, 260)" opacity="0.8">
    <polygon points="45,0 20,45 38,45 15,90 60,35 40,35" fill="none" stroke="#00b4d8" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="45,0 20,45 38,45 15,90 60,35 40,35" fill="#00b4d8" opacity="0.15"/>
  </g>

  <!-- Features list -->
  <g transform="translate(30, 410)">
    <circle cx="6" cy="6" r="4" fill="#00b4d8" opacity="0.8"/>
    <text x="18" y="10" font-family="Arial, sans-serif" font-size="11" fill="#90d4e8">Proven memory techniques</text>

    <circle cx="6" cy="26" r="4" fill="#00b4d8" opacity="0.8"/>
    <text x="18" y="30" font-family="Arial, sans-serif" font-size="11" fill="#90d4e8">Focus &amp; concentration strategies</text>

    <circle cx="6" cy="46" r="4" fill="#00b4d8" opacity="0.8"/>
    <text x="18" y="50" font-family="Arial, sans-serif" font-size="11" fill="#90d4e8">Practical exercises for students</text>
  </g>

  <!-- Bottom author section -->
  <rect x="0" y="470" width="400" height="90" fill="black" opacity="0.3"/>
  <rect x="0" y="470" width="400" height="2" fill="url(#accent2)"/>
  <text x="30" y="500" font-family="Arial, sans-serif" font-size="11" fill="#90d4e8" letter-spacing="2">AUTHOR</text>
  <text x="30" y="525" font-family="Georgia, serif" font-size="20" fill="white" font-weight="bold">Preeti Sachdeva</text>
  <text x="30" y="545" font-family="Arial, sans-serif" font-size="10" fill="#00b4d8" letter-spacing="1">Memory Training Specialist</text>

  <!-- Order badge -->
  <circle cx="350" cy="510" r="32" fill="#00b4d8" opacity="0.9"/>
  <text x="350" y="504" font-family="Arial, sans-serif" font-size="9" fill="white" text-anchor="middle" font-weight="bold">Order via</text>
  <text x="350" y="518" font-family="Arial, sans-serif" font-size="9" fill="white" text-anchor="middle">WhatsApp</text>
</svg>
