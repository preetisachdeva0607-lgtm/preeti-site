<svg xmlns="http://www.w3.org/2000/svg" width="400" height="560" viewBox="0 0 400 560">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1929"/>
      <stop offset="50%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0a1929"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#ff8e53"/>
    </linearGradient>
    <linearGradient id="brain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#ff8e53;stop-opacity:0.1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="560" fill="url(#bg1)"/>

  <!-- Decorative circles -->
  <circle cx="320" cy="80" r="120" fill="none" stroke="#ff6b6b" stroke-width="0.5" opacity="0.2"/>
  <circle cx="320" cy="80" r="80" fill="none" stroke="#ff6b6b" stroke-width="0.5" opacity="0.2"/>
  <circle cx="80" cy="460" r="100" fill="none" stroke="#4a90d9" stroke-width="0.5" opacity="0.2"/>

  <!-- Brain illustration (simplified) -->
  <g transform="translate(120, 60)" opacity="0.15" fill="#ff6b6b">
    <ellipse cx="80" cy="70" rx="75" ry="65"/>
    <ellipse cx="50" cy="70" rx="45" ry="55" fill="#0a1929"/>
    <ellipse cx="110" cy="70" rx="45" ry="55" fill="#0a1929"/>
    <rect x="72" y="30" width="16" height="80" fill="#0a1929"/>
  </g>

  <!-- Neural network dots -->
  <g opacity="0.4">
    <circle cx="60" cy="140" r="3" fill="#ff6b6b" filter="url(#glow)"/>
    <circle cx="120" cy="110" r="2" fill="#ff6b6b"/>
    <circle cx="180" cy="130" r="3" fill="#ff8e53" filter="url(#glow)"/>
    <circle cx="240" cy="105" r="2" fill="#ff6b6b"/>
    <circle cx="300" cy="125" r="3" fill="#ff6b6b" filter="url(#glow)"/>
    <circle cx="340" cy="100" r="2" fill="#ff8e53"/>
    <line x1="60" y1="140" x2="120" y2="110" stroke="#ff6b6b" stroke-width="0.5" opacity="0.5"/>
    <line x1="120" y1="110" x2="180" y2="130" stroke="#ff6b6b" stroke-width="0.5" opacity="0.5"/>
    <line x1="180" y1="130" x2="240" y2="105" stroke="#ff6b6b" stroke-width="0.5" opacity="0.5"/>
    <line x1="240" y1="105" x2="300" y2="125" stroke="#ff6b6b" stroke-width="0.5" opacity="0.5"/>
    <line x1="300" y1="125" x2="340" y2="100" stroke="#ff6b6b" stroke-width="0.5" opacity="0.5"/>
    <line x1="60" y1="140" x2="180" y2="130" stroke="#ff8e53" stroke-width="0.3" opacity="0.3"/>
    <line x1="120" y1="110" x2="300" y2="125" stroke="#ff8e53" stroke-width="0.3" opacity="0.3"/>
  </g>

  <!-- Coral top bar -->
  <rect x="0" y="0" width="8" height="560" fill="url(#accent1)"/>

  <!-- Content area -->
  <!-- Tag line -->
  <rect x="30" y="170" width="200" height="2" fill="url(#accent1)" rx="1"/>
  <text x="30" y="165" font-family="Georgia, serif" font-size="11" fill="#ff6b6b" letter-spacing="3" font-weight="bold">NLP GUIDE FOR TEENS</text>

  <!-- Main title -->
  <text x="30" y="230" font-family="Georgia, serif" font-size="38" fill="white" font-weight="bold" letter-spacing="-1">The User</text>
  <text x="30" y="278" font-family="Georgia, serif" font-size="38" fill="white" font-weight="bold" letter-spacing="-1">Manual</text>
  <text x="30" y="316" font-family="Georgia, serif" font-size="24" fill="#ff6b6b" font-weight="bold">for Your</text>
  <text x="30" y="354" font-family="Georgia, serif" font-size="24" fill="#ff6b6b" font-weight="bold">Mind</text>

  <!-- Subtitle line -->
  <rect x="30" y="375" width="340" height="1" fill="white" opacity="0.1"/>

  <!-- Description -->
  <text x="30" y="400" font-family="Arial, sans-serif" font-size="12" fill="#a0b4c8" letter-spacing="0.5">Decode your mind. Master your emotions.</text>
  <text x="30" y="418" font-family="Arial, sans-serif" font-size="12" fill="#a0b4c8" letter-spacing="0.5">Build unshakeable confidence.</text>

  <!-- Gear/mind icon -->
  <g transform="translate(290, 280)" opacity="0.7">
    <circle cx="40" cy="40" r="28" fill="none" stroke="#ff6b6b" stroke-width="2"/>
    <circle cx="40" cy="40" r="12" fill="none" stroke="#ff6b6b" stroke-width="2"/>
    <line x1="40" y1="8" x2="40" y2="0" stroke="#ff6b6b" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="72" x2="40" y2="80" stroke="#ff6b6b" stroke-width="3" stroke-linecap="round"/>
    <line x1="8" y1="40" x2="0" y2="40" stroke="#ff6b6b" stroke-width="3" stroke-linecap="round"/>
    <line x1="72" y1="40" x2="80" y2="40" stroke="#ff6b6b" stroke-width="3" stroke-linecap="round"/>
    <line x1="16" y1="16" x2="10" y2="10" stroke="#ff6b6b" stroke-width="3" stroke-linecap="round"/>
    <line x1="64" y1="64" x2="70" y2="70" stroke="#ff6b6b" stroke-width="3" stroke-linecap="round"/>
    <line x1="64" y1="16" x2="70" y2="10" stroke="#ff6b6b" stroke-width="3" stroke-linecap="round"/>
    <line x1="16" y1="64" x2="10" y2="70" stroke="#ff6b6b" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Bottom author section -->
  <rect x="0" y="470" width="400" height="90" fill="black" opacity="0.3"/>
  <rect x="0" y="470" width="400" height="2" fill="url(#accent1)"/>
  <text x="30" y="500" font-family="Arial, sans-serif" font-size="11" fill="#a0b4c8" letter-spacing="2">AUTHOR</text>
  <text x="30" y="525" font-family="Georgia, serif" font-size="20" fill="white" font-weight="bold">Preeti Sachdeva</text>
  <text x="30" y="545" font-family="Arial, sans-serif" font-size="10" fill="#ff6b6b" letter-spacing="1">NLP Coach &amp; Parenting Expert</text>

  <!-- Price badge -->
  <circle cx="350" cy="510" r="32" fill="url(#accent1)" opacity="0.9"/>
  <text x="350" y="504" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">₹499</text>
  <text x="350" y="520" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle">Amazon</text>
  <text x="350" y="532" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle">KDP</text>
</svg>
